name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: Release Version (no 'v' prefix)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:

      # SETUP & VALIDATION

      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Validate Release Version
        if: ${{ startsWith(github.event.inputs.version, 'v') }}
        uses: actions/github-script@ffc2c79a5b2490bd33e0a41c1de74b877714d736 # v3
        with:
          script: |
            core.setFailed('Version ${{ github.event.inputs.version }} must not start with \'v\'. Use a non-prefixed semantic version, e.g. 1.2.3')

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Clean
        run: ./gradlew clean

      - name: Build
        run: ./gradlew assemble

      - name: Test
        run: ./gradlew test --info

      # SET VERSIONS

      - name: Set Version (Gradle)
        uses: jacobtomlinson/gha-find-replace@f485fdc3f67a6d87ae6e3d11e41f648c26d7aee3 # v2
        with:
          find: 'version = ".*"'
          replace: 'version = "${{ github.event.inputs.version }}"'
          include: 'core/build.gradle.kts'
          regex: true
      - name: Set Version (Const)
        uses: jacobtomlinson/gha-find-replace@f485fdc3f67a6d87ae6e3d11e41f648c26d7aee3 # v2
        with:
          find: 'const val EVALUATION_PROXY_VERSION = ".*"'
          replace: 'const val EVALUATION_PROXY_VERSION = "${{ github.event.inputs.version }}"'
          include: 'core/src/main/kotlin/EvaluationProxy.kt'
          regex: true

      # RELEASE CORE PACKAGE

      - name: Release evaluation-proxy-core ${{ github.event.inputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
        run: |
          ./gradlew core:publishToMavenCentral

      # RELEASE DOCKER IMAGE

      - name: Configure AWS credentials
        uses: amplitude/actions/configure-aws-credentials@v0
        with:
          account: ops

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: amplitude/actions/amazon-ecr-login@v0

      - name: Get Build Date
        run: |
          echo "BUILD_DATE=$( date -u +'%Y-%m-%dT%H:%M:%SZ' )" >> $GITHUB_ENV

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@818d4b7b91585d195f67373fd9cb0332e31a7175 # v4
        with:
          tags: type=semver,pattern={{version}},value=v${{ github.event.inputs.version }}
          images: ${{ steps.login-ecr.outputs.registry }}/evaluation-proxy

      - name: Docker Build and Push
        uses: amplitude/actions/build-push-action@v0
        with:
          context: .
          push: true
          build-args: BUILD_DATE=${{ env.BUILD_DATE }}
          tags: ${{ steps.meta.outputs.tags }}

      # COMMIT RELEASE

      - name: Commit Release
        env:
          GH_PUBLISH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          GIT_AUTHOR_NAME: amplitude-sdk-bot
          GIT_AUTHOR_EMAIL: amplitude-sdk-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: amplitude-sdk-bot
          GIT_COMMITTER_EMAIL: amplitude-sdk-bot@users.noreply.github.com
        run: |
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PUBLISH_TOKEN" | base64 -w0)"
          git commit -am "release: ${VERSION}"
          git tag "v${VERSION}"
          git push
          git push --tags
          git config --local --unset-all http.https://github.com/.extraheader
